<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(#{video.training.analytics})}"></head>
<body class="Mrphs-toolBody sakai-video-training">
<div class="Mrphs-sakai-video-training portletBody container-fluid sakai-video-training">
    <div th:replace="~{fragments/common :: menu('analytics', ${canManage}, ${canAnalytics}, ${canView})}"></div>
    <div th:replace="~{fragments/common :: messages(${success}, ${error})}"></div>

    <h1 class="h3" th:text="#{video.training.analytics}">Analytics</h1>

    <div class="table-responsive" th:if="${!#lists.isEmpty(analytics)}">
    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th scope="col" th:text="#{video.training.analytics.video}">Video</th>
            <th scope="col" th:text="#{video.training.analytics.views}">Views</th>
            <th scope="col" th:text="#{video.training.analytics.unique}">Unique viewers</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="summary : ${analytics}" th:with="video=${videoById[summary.videoId]}">
            <td>
                <div class="d-flex align-items-center gap-3" th:if="${video != null}">
                    <div class="position-relative style-thumb-container" style="width: 120px; flex-shrink: 0;">
                        <video class="vt-video-thumb img-thumbnail"
                            th:if="${thumbnailIsVideoById[video.id]}"
                            th:src="${thumbnailUrlById[video.id]}"
                            data-thumb-retry="true"
                            muted
                            preload="metadata"
                            playsinline
                            aria-hidden="true"
                            style="width: 100%; height: auto; aspect-ratio: 16/9; object-fit: cover;">
                        </video>
                        <img class="vt-video-thumb img-thumbnail"
                            th:if="${!thumbnailIsVideoById[video.id] && !#strings.isEmpty(thumbnailUrlById[video.id])}"
                            th:src="${thumbnailUrlById[video.id]}"
                            data-thumb-retry="true"
                            alt="Video thumbnail"
                            th:attr="alt=${video.title}"
                            style="width: 100%; height: auto; aspect-ratio: 16/9; object-fit: cover;">
                        <div class="vt-video-thumb vt-video-thumb-placeholder img-thumbnail d-flex align-items-center justify-content-center bg-dark text-white"
                            th:classappend="${!#strings.isEmpty(thumbnailUrlById[video.id])} ? ' vt-is-hidden' : ''"
                            style="width: 100%; height: auto; aspect-ratio: 16/9;">
                            <span class="vt-video-thumb-play" aria-hidden="true">&#9658;</span>
                        </div>
                    </div>
                    <div>
                        <a class="fw-bold text-decoration-none" 
                           th:href="@{/videos/{id}(id=${video.id})}" 
                           th:text="${video.title}">
                           Video title
                        </a>
                    </div>
                </div>
            </td>
            <td th:text="${summary.viewCount}">0</td>
            <td th:text="${summary.uniqueViewerCount}">0</td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="sak-banner-info" role="status" th:if="${#lists.isEmpty(analytics)}" th:text="#{video.training.analytics.empty}">No analytics data available yet.</div>

    <a class="btn btn-outline-secondary" th:href="@{/videos}" th:text="#{video.training.back}">Back</a>
</div>
<div th:replace="~{fragments/common :: jQuery}"></div>
</body>
</html>
